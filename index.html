<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#171611"><title>Court of Crows — A game of gold & treachery</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap');
    :root{--bg:#171611;--panel:#211f19;--line:#39362d;--paper:#eae2cf;--muted:#9f998b;--gold:#e3b95f;--red:#be6550;--cream:#f4eedf}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--paper);font-family:'DM Sans',sans-serif;min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}.grain{position:fixed;inset:0;pointer-events:none;opacity:.12;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.88' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.12'/%3E%3C/svg%3E")}
    .shell{max-width:1240px;margin:auto;padding:26px 28px 44px;position:relative}.topbar{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:18px}.brand{display:flex;align-items:center;gap:12px}.sigil{width:38px;height:38px;border:1px solid #766643;color:var(--gold);display:grid;place-items:center;font:24px 'Playfair Display'}.brand-title{font:600 17px 'Playfair Display';letter-spacing:.03em}.brand-sub{font:10px 'DM Mono';letter-spacing:.16em;color:var(--muted);margin-top:3px}.room-badge{font:11px 'DM Mono';color:var(--muted);letter-spacing:.08em}.room-badge b{color:var(--gold)}
    .hero{padding:55px 0 30px;max-width:750px}.eyebrow{color:var(--gold);font:11px 'DM Mono';letter-spacing:.18em;text-transform:uppercase}.hero h1{font:600 clamp(42px,7vw,76px)/.98 'Playfair Display';letter-spacing:-.035em;margin:15px 0 18px}.hero h1 em{color:var(--gold);font-weight:500}.hero p{max-width:590px;color:#aaa395;line-height:1.7;margin:0}.lobby-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:800px}.panel,.sidepanel,.actionbox{background:var(--panel);border:1px solid var(--line)}.panel{padding:24px}.panel h2{font:600 22px 'Playfair Display';margin:0 0 7px}.panel p{color:var(--muted);font-size:13px;margin:0 0 15px;line-height:1.55}.input{width:100%;background:#171611;border:1px solid #4b473d;padding:12px 13px;color:var(--paper);outline:none}.input:focus{border-color:var(--gold)}.input::placeholder{color:#746f62}.btn{border:0;padding:12px 17px;font-weight:700;white-space:nowrap;background:var(--gold);color:#221d11}.btn:hover{filter:brightness(1.08)}.btn.dark{background:#39362d;color:var(--paper)}.btn.small{padding:9px 11px;font-size:12px}.hint,.fine{font-size:11px;color:var(--muted);line-height:1.6}.table{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:18px;margin-top:30px}.maincol,.sidecol{min-width:0}.event-banner{border:1px solid #574b2e;background:linear-gradient(110deg,#2a261a,#211f19);padding:19px 22px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:18px}.event-banner h2{font:600 24px 'Playfair Display';margin:7px 0 4px}.event-effect{font-size:12px;color:#bdb5a4;line-height:1.5;max-width:620px}.event-icon{font-size:30px;color:var(--gold);opacity:.9}.stats{display:flex;gap:24px;flex-wrap:wrap;font:10px 'DM Mono';letter-spacing:.06em;color:var(--muted)}.stats>div{display:flex;flex-direction:column;gap:6px}.stats strong{color:var(--gold);font-size:14px;font-weight:500}
    .roster{display:grid;grid-template-columns:repeat(auto-fit,minmax(142px,1fr));gap:9px;margin:12px 0 18px}.player{border:1px solid var(--line);background:#211f19;padding:13px}.player.current{border-color:#766643}.pname{font-size:13px;font-weight:700}.role{font:9px 'DM Mono';letter-spacing:.09em;color:var(--gold);margin:7px 0}.coin,.influence{font:11px 'DM Mono';margin-top:5px}.coin{color:var(--gold)}.influence{color:#9db49d}.player small{display:block;color:var(--muted);font:10px 'DM Mono';margin-top:7px}.phase-label{font:10px 'DM Mono';letter-spacing:.16em;color:var(--gold);text-transform:uppercase;margin:20px 0 10px}
    .hand{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:9px}.card{background:var(--cream);color:#252218;min-height:132px;border:2px solid transparent;padding:13px;display:flex;flex-direction:column;justify-content:space-between;transition:.13s;user-select:none}.card:hover{transform:translateY(-3px)}.card.selected{border-color:var(--gold);box-shadow:0 0 0 2px #e3b95f38}.card b{font:600 17px 'Playfair Display'}.card small{font-size:11px;line-height:1.4;color:#625c4d}.card .type{font:9px 'DM Mono';letter-spacing:.12em;color:#8d7140}.target-list{display:grid;gap:8px;margin:12px 0}.target-row{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding:8px 0}.target-row label{font:11px 'DM Mono';color:var(--gold);min-width:115px}.target-row select{flex:1}
    .actionbox{padding:17px;margin-top:15px}.actionbox h3{font:600 19px 'Playfair Display';margin:0 0 7px}.actionbox p{font-size:12px;line-height:1.6;color:var(--muted);margin:0 0 14px}.decrees{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}.decree{border:1px solid #544a34;padding:8px 10px;color:var(--muted);font:10px 'DM Mono';background:transparent}.decree.active{color:var(--gold);border-color:var(--gold);background:#332d1e}.decree-copy{font-size:11px;color:#bdb5a4;margin:7px 0 12px;line-height:1.5}.row{display:flex;flex-wrap:wrap;gap:9px}.sidepanel{padding:18px;margin-bottom:13px}.sidepanel h3{font:600 17px 'Playfair Display';margin:0 0 12px}.succession{font:11px 'DM Mono';color:var(--muted)}.succession strong{color:var(--gold)}.log{max-height:240px;overflow:auto}.logline{font-size:11px;line-height:1.5;padding:8px 0;border-bottom:1px solid #353228;color:#b6af9f}.logline:last-child{border:0}.chatlog{max-height:245px;overflow:auto;display:grid;gap:9px;margin-bottom:12px}.chatline{font-size:12px;line-height:1.45;overflow-wrap:anywhere}.chatline b{color:var(--gold);margin-right:6px}.chatline time{display:block;font:9px 'DM Mono';color:var(--muted);margin-top:2px}.chat-form{display:flex;gap:7px}.chat-form .input{min-width:0;padding:9px}.waiting{border:1px dashed #625943;color:var(--muted);padding:22px;text-align:center;font-size:13px;line-height:1.6}.progress{height:4px;background:#3d392f;margin-top:8px}.progress span{height:100%;display:block;background:var(--gold)}
    details.almanac{padding:0}details.almanac summary{cursor:pointer;list-style:none;font:600 17px 'Playfair Display';padding:18px}details.almanac summary::-webkit-details-marker{display:none}details.almanac summary:after{content:'＋';float:right;color:var(--gold);font:14px 'DM Mono'}details.almanac[open] summary:after{content:'−'}.almanac-body{padding:0 18px 18px}.almanac-body h4{color:var(--gold);font:10px 'DM Mono';letter-spacing:.13em;text-transform:uppercase;margin:17px 0 6px}.rule-row{font-size:11px;line-height:1.45;color:#bbb3a3;border-bottom:1px solid #353228;padding:7px 0}.rule-row b{color:var(--paper);display:block;margin-bottom:2px}.footer{padding-top:24px;color:#716c60;font:10px 'DM Mono'}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#33261f;color:#f2d9ca;border:1px solid #79503e;padding:12px 17px;font-size:13px;z-index:5;display:none}
    .event-overlay{position:fixed;inset:0;z-index:10;background:#090906d9;display:grid;place-items:center;padding:20px}.event-modal{width:min(560px,100%);padding:25px;background:linear-gradient(145deg,#302918,#211f19 70%);border:1px solid #8b7040;box-shadow:0 24px 90px #000b;text-align:center}.event-art{height:170px;margin:18px auto 16px;max-width:480px;overflow:hidden;border:1px solid #665434;background:#171611}.event-art svg{display:block;width:100%;height:100%}.event-modal h2{font:600 32px 'Playfair Display';margin:12px 0;color:var(--cream)}.event-modal p{font-size:14px;line-height:1.7;color:#c6bdab;margin:0 auto 22px;max-width:430px}
    @media(max-width:750px){.shell{padding:16px}.hero{padding:42px 0 26px}.table{grid-template-columns:1fr}.lobby-grid{grid-template-columns:1fr}.sidecol{display:grid;grid-template-columns:1fr 1fr;gap:10px}.sidepanel{margin:0}.card{min-height:120px}}@media(max-width:470px){.sidecol{grid-template-columns:1fr}.hero h1{font-size:52px}.event-banner{padding:15px}.target-row{align-items:flex-start;flex-direction:column}.target-row label{min-width:0;width:100%}}
  </style>
</head>
<body><div class="grain"></div><div id="app"></div><div class="toast" id="toast"></div>
<script>
const app=document.querySelector('#app');
let state=null,token=localStorage.getItem('crows-token'),roomCode=localStorage.getItem('crows-room');
let selected=[],targets={},decree='Royal Prerogative',selectedLaw='Next in Line',favorTarget='',appointedTarget='',assassinationSpend=false,successionSpend=false,almanacOpen=false,polling=false,chatDraft='',eventModal=null;
const cardTargets=new Set(['Secret Pact','Spy Network','Blackmail','Court Censure']);
const lawText={
  'Next in Line':'The next name in the player list inherits, wrapping to the top if needed.',
  'Richest Vassal':'The vassal with the most gold takes the crown; ties go to Next in Line.',
  'Court Vote':'Everyone votes for the next monarch after an assassination. Spend 1 influence to make your vote count double; ties go to Next in Line.',
  'Appointed Heir':'The monarch selects a named heir when changing the law.',
  'Assassin Inherits':'If the assassination succeeds, the player who played Assassination Plot immediately becomes monarch.'
};
const decreeText={
  'Royal Prerogative':'The monarch gains 3 gold and 1 influence.',
  'Favor the Heir':'The heir gains 2 gold and 1 influence. The monarch gains 1 gold.',
  'Favor a Vassal':'Choose one vassal: they gain 2 gold and 1 influence; the monarch gains 1 gold.',
  'Change Succession':'Costs 2 influence to change the succession law. Keeping the same law costs nothing.'
};
function eventIllustration(name){
  const scenes={
    'The Harvest Tax':'<path d="M145 160Q154 104 130 55M145 160Q144 101 167 48M145 122Q119 92 112 78M148 111Q173 85 183 64M260 160V74M260 75Q230 58 239 43Q264 43 260 75ZM261 89Q291 66 301 80Q294 101 261 89Z" fill="none" stroke="#dfbd68" stroke-width="5" stroke-linecap="round"/><circle cx="350" cy="119" r="39" fill="#c59a42" stroke="#f2d794" stroke-width="3"/><circle cx="350" cy="119" r="29" fill="none" stroke="#6c5125" stroke-width="2"/><path d="M350 98v42m11-33q-14-13-22 0-6 11 11 13 17 3 10 14-7 12-23 0" fill="none" stroke="#513d20" stroke-width="4"/>',
    'A Royal Wedding':'<path d="M191 145Q205 98 254 91Q303 98 317 145Q253 169 191 145Z" fill="#783e3c" stroke="#d5b86e" stroke-width="3"/><circle cx="236" cy="116" r="25" fill="none" stroke="#e4c977" stroke-width="7"/><circle cx="271" cy="116" r="25" fill="none" stroke="#e4c977" stroke-width="7"/><path d="M253 52l10 14 17-5-6 18 13 12-20 1-8 17-8-17-19-1 13-12-6-18 17 5Z" fill="#dfbd68"/><path d="M118 160q12-24 24 0m-9-18v18m257 0q12-24 24 0m-9-18v18" stroke="#9fa879" stroke-width="4" fill="none"/>',
    'Border Skirmish':'<path d="M114 153V98l30-25 30 25v55m158 0V93l35-30 35 30v60M107 153h307" fill="#3e3a31" stroke="#b99d62" stroke-width="4"/><path d="M127 102h12v20h-12zm32 0h12v20h-12zm167-3h14v21h-14zm37 0h14v21h-14z" fill="#dfbd68"/><path d="M204 52l143 102m-8-106L197 151" stroke="#d7c18e" stroke-width="7" stroke-linecap="round"/><path d="M191 47l18 5-13 18m154-22-18 5 13 18" fill="none" stroke="#b85f4e" stroke-width="6"/>',
    'The King’s Feast':'<path d="M162 146q7-42 47-42t47 42q-44 18-94 0Z" fill="#874739" stroke="#dfbd68" stroke-width="3"/><path d="M185 116q9-17 18 0m6 0q9-17 18 0" fill="none" stroke="#e2c77f" stroke-width="4"/><path d="M292 86h55l-8 45q-20 21-39 0Z" fill="#9d533e" stroke="#dfbd68" stroke-width="4"/><path d="M300 85q-4-23 18-22 22 0 19 22M318 132v20m-17 0h34" fill="none" stroke="#dfbd68" stroke-width="4"/><path d="M111 84v65m-8-51h16m146-14v65m-8-51h16" stroke="#d8bd72" stroke-width="4"/><path d="M105 83q6-18 12 0m128 0q6-18 12 0" fill="#f0b965"/>',
    'A Missing Heir':'<path d="M184 91h133l-11 54H195Z" fill="#644934" stroke="#d2b568" stroke-width="4"/><path d="M174 91h153M194 145v15m101-15v15m-92-60V68m83 28V68" stroke="#dfbd68" stroke-width="5"/><path d="M245 55q13-18 27 0-14 9-27 0Z" fill="#eee1bd"/><path d="M359 60l8 18 19 2-14 12 4 19-17-9-17 9 4-19-14-12 19-2Z" fill="#d7bd72"/><circle cx="131" cy="69" r="20" fill="#e9dcae"/><circle cx="138" cy="65" r="20" fill="#211f19"/>',
    'The Plague Bell':'<path d="M224 137q16-17 16-48 0-37 27-37t27 37q0 31 16 48Z" fill="#8b6447" stroke="#d7bd72" stroke-width="4"/><path d="M213 139h108m-62-75q8-13 16 0m-16 84q0 18 16 18t16-18" fill="none" stroke="#d7bd72" stroke-width="5"/><circle cx="267" cy="106" r="10" fill="#d7bd72"/><path d="M267 96v20m-10-10h20" stroke="#513c2a" stroke-width="3"/><path d="M152 62v82m-16-67h32m136-15v82m-16-67h32" stroke="#7b715d" stroke-width="3"/>',
    'A Merchant’s Petition':'<path d="M254 67v86m-67-64h134M206 89l-18 42h38l-20-42m96 0-20 42h40l-20-42" fill="none" stroke="#d7bd72" stroke-width="5"/><path d="M177 132q19 20 39 0m77 0q19 20 39 0m-110 21h68" fill="none" stroke="#d7bd72" stroke-width="4"/><circle cx="254" cy="54" r="14" fill="#c89f4f"/><path d="M254 47v14m5-11q-5-6-10 0-3 5 5 6 8 1 5 6-4 5-10 0" fill="none" stroke="#594522" stroke-width="2"/><path d="M120 148h38m244 0h38" stroke="#9e8050" stroke-width="4"/>',
    'The Winter Levy':'<path d="M133 157V96l34-29 34 29v61m151 0V88l38-33 38 33v69" fill="#45423a" stroke="#c8b77e" stroke-width="4"/><path d="M154 104h25v53h-25zm174-4h29v57h-29z" fill="#211f19" stroke="#ab925d" stroke-width="3"/><path d="M111 82l18 9 18-9 20 8 20-9 18 7m132-28 19 9 20-9 19 8 19-9 18 7" fill="none" stroke="#e4e0d2" stroke-width="5"/><path d="M252 91l10 15 18-4-7 17 14 12-19 1-8 17-8-17-19-1 13-12-6-17 17 4Z" fill="#d9cfb0"/>',
    'Night of Knives':'<path d="M133 66l91 91m-75-111 102 102m-18-12-18 18m-5-130q25-18 47 0-20-6-31 7-13 14-8 32-21-12-8-39Z" fill="none" stroke="#cbb06b" stroke-width="5" stroke-linecap="round"/><path d="M330 47l-36 87 25-18 15 34 10-9-15-33 25-4Z" fill="#b95c4d" stroke="#e2c988" stroke-width="3"/><path d="M140 158h280" stroke="#786646" stroke-width="3"/><circle cx="374" cy="62" r="3" fill="#e6dba9"/><circle cx="403" cy="91" r="2" fill="#e6dba9"/>'
  };
  const scene=scenes[name]||scenes['Night of Knives'];return `<svg viewBox="0 0 560 190" role="img" aria-label="Illustration for ${esc(name)}" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="event-sky" x2="0" y2="1"><stop stop-color="#42351e"/><stop offset="1" stop-color="#1b1a15"/></linearGradient></defs><rect width="560" height="190" fill="url(#event-sky)"/><path d="M0 159Q130 138 245 160T560 151v39H0Z" fill="#25241d"/><circle cx="280" cy="95" r="73" fill="#c5a65a" opacity=".09"/><circle cx="73" cy="38" r="2" fill="#eadcae"/><circle cx="460" cy="45" r="2" fill="#eadcae"/><circle cx="425" cy="119" r="1.5" fill="#eadcae"/>${scene}<path d="M22 18h25m-25 0v18m516-18h-25m25 0v18M22 172h25m-25 0v-18m516 18h-25m25 0v-18" fill="none" stroke="#927748" stroke-width="2"/></svg>`;
}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function api(path,data){const r=await fetch('/api/'+path,{method:data?'POST':'GET',headers:{'content-type':'application/json'},body:data?JSON.stringify(data):undefined});const d=await r.json();if(!r.ok)throw Error(d.error||'Something went wrong.');return d;}
function toast(text){const el=document.querySelector('#toast');el.textContent=text;el.style.display='block';setTimeout(()=>el.style.display='none',2800)}
function save(){localStorage.setItem('crows-token',token);localStorage.setItem('crows-room',roomCode)}
function clearRoomSession(){token=null;roomCode=null;state=null;selected=[];targets={};localStorage.removeItem('crows-token');localStorage.removeItem('crows-room');renderLanding()}
async function leaveCourt(){const finished=state?.phase==='ended';if(!finished&&!window.confirm('Leave this match? Your player will leave the court, and the game may return to the lobby if fewer than two players remain.'))return;try{if(!finished&&token&&roomCode)await api('leave/'+roomCode,{token})}catch(e){toast(e.message);return}clearRoomSession()}
async function create(){try{const d=await api('create',{name:document.querySelector('#create-name').value||'Player'});token=d.token;roomCode=d.state.code;save();update(d.state)}catch(e){toast(e.message)}}
async function join(){try{const c=document.querySelector('#code').value.trim().toUpperCase();const d=await api('join/'+c,{name:document.querySelector('#join-name').value||'Player'});token=d.token;roomCode=c;save();update(d.state)}catch(e){toast(e.message)}}
async function act(path,data={}){try{const d=await api(path+'/'+roomCode,{...data,token});update(d.state)}catch(e){toast(e.message)}}
async function sendChat(){const message=chatDraft.trim();if(!message)return;chatDraft='';try{const d=await api('chat/'+roomCode,{token,message});update(d.state)}catch(e){chatDraft=message;toast(e.message);renderGame()}}
async function refresh(){if(!token||!roomCode||polling)return;polling=true;try{const d=await api('state/'+roomCode+'?token='+encodeURIComponent(token));update(d.state)}catch{token=null;roomCode=null;save();renderLanding()}finally{polling=false}}
function update(s){if(!s)return;const changed=JSON.stringify(state)!==JSON.stringify(s);const sameTurn=state&&state.code===s.code&&state.phase===s.phase&&state.round===s.round&&JSON.stringify(state.hand)===JSON.stringify(s.hand);if(!changed)return;if(state&&s.round>state.round&&s.event)eventModal={name:s.event,effect:s.eventEffect};state=s;if(!sameTurn){selected=[];targets={};assassinationSpend=false;successionSpend=false}renderGame()}
function renderLanding(){app.innerHTML=`<div class="shell"><header class="topbar"><div class="brand"><div class="sigil">♜</div><div><div class="brand-title">COURT OF CROWS</div><div class="brand-sub">A GAME OF GOLD & TREACHERY</div></div></div><div class="room-badge">2–8 PLAYERS · PRIVATE ROOMS</div></header><section class="hero"><div class="eyebrow">The realm is ripe for ambition</div><h1>Trust is a <em>currency.</em><br>Spend it wisely.</h1><p>Gather gold. Court the vassals. Keep one eye on the throne—and another on the knife beneath the table.</p></section><div class="lobby-grid"><div class="panel"><h2>Found a court</h2><p>Create a private room and invite your rivals by code. The crown is yours to lose.</p><input class="input" id="create-name" maxlength="16" placeholder="Your name" aria-label="Name for the host" value="${esc(localStorage.getItem('crows-name')||'')}" oninput="localStorage.setItem('crows-name',this.value)"><button class="btn" style="margin-top:10px;width:100%" onclick="create()">Create room →</button></div><div class="panel"><h2>Join the intrigue</h2><p>Enter your name and the room code shared by your host. Alliances are temporary. Gold is forever.</p><input class="input" id="join-name" maxlength="16" placeholder="Your name" aria-label="Your name as a joining player" value="${esc(localStorage.getItem('crows-name')||'')}" oninput="localStorage.setItem('crows-name',this.value)"><input class="input" id="code" maxlength="4" placeholder="ROOM CODE" aria-label="Room code" style="margin-top:9px;text-transform:uppercase;letter-spacing:.2em" oninput="this.value=this.value.toUpperCase()"><button class="btn dark" style="margin-top:10px;width:100%" onclick="join()">Enter the court →</button></div></div><div class="footer">A living court · 2–8 players · First to 30 gold takes the realm</div></div>`}
function almanac(){const cards=Object.entries(state.almanac.cards).map(([name,effect])=>`<div class="rule-row"><b>${esc(name)}</b>${esc(effect)}</div>`).join('');const events=state.almanac.events.map(e=>`<div class="rule-row"><b>${esc(e.name)}</b>${esc(e.effect)}</div>`).join('');const laws=state.almanac.laws.map(law=>`<div class="rule-row"><b>${esc(law)}</b>${esc(lawText[law])}</div>`).join('');return `<details class="sidepanel almanac" ${almanacOpen?'open':''} ontoggle="almanacOpen=this.open"><summary>Cards, events & court rules</summary><div class="almanac-body"><h4>All court cards</h4>${cards}<h4>Round events</h4>${events}<h4>Royal decrees</h4>${Object.entries(decreeText).map(([n,t])=>`<div class="rule-row"><b>${esc(n)}</b>${esc(t)}</div>`).join('')}<h4>Succession laws</h4>${laws}<h4>Card combos</h4>${state.almanac.combos.map(c=>`<div class="rule-row"><b>${esc(c.name)} — ${esc(c.cards)}</b>${esc(c.effect)}</div>`).join("")}<h4>Influence</h4><div class="rule-row"><b>Gain it</b>Accepted Secret Pacts, tribute to the monarch, Royal Prerogative, and the Missing Heir event grant influence.</div><div class="rule-row"><b>Spend it</b>Spend 1 influence on an assassination or Court Vote ballot to make your vote count twice. The monarch pays 2 influence to change succession law.</div></div></details>`}
function targetOptions(current,card){return state.players.filter(p=>p.id!==state.you).map(p=>`<option value="${p.id}" ${current===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}
function renderGame(){
  const restoreChatFocus=document.activeElement?.id==='chat-input';const chatCursor=restoreChatFocus?document.activeElement.selectionStart:null;
  const me=state.players.find(p=>p.id===state.you);if(!me)return;
  const lobby=state.phase==='lobby';const myplay=me.ready;
  const targetFields=selected.filter(i=>cardTargets.has(state.hand[i])).map(i=>`<div class="target-row"><label>${esc(state.hand[i])} target</label><select class="input" onchange="targets[${i}]=this.value">${targetOptions(targets[i]||state.players.find(p=>p.id!==state.you)?.id,state.hand[i])}</select></div>`).join('');
  const decreePanel=me.king?`<div class="decrees">${Object.keys(decreeText).map(d=>`<button class="decree ${decree===d?'active':''}" onclick="if('${d}'==='Change Succession'&&decree!=='${d}')selectedLaw=state.succession;decree='${d}';renderGame()">${esc(d)}</button>`).join('')}</div><div class="decree-copy">${esc(decreeText[decree])}</div>${decree==='Favor a Vassal'?`<select class="input" id="favor" onchange="favorTarget=this.value">${state.players.filter(p=>!p.king).map(p=>`<option value="${p.id}" ${(favorTarget===p.id||(!favorTarget&&p.id===state.players.find(x=>!x.king)?.id))?'selected':''}>${esc(p.name)}</option>`).join('')}</select>`:''}${decree==='Change Succession'?`<select class="input" id="succession-law" onchange="selectedLaw=this.value;renderGame()">${state.almanac.laws.map(l=>`<option value="${esc(l)}" ${selectedLaw===l?'selected':''}>${esc(l)}</option>`).join('')}</select><div class="decree-copy">${esc(lawText[selectedLaw])}</div>${selectedLaw==='Appointed Heir'?`<select class="input" id="appointed-heir" onchange="appointedTarget=this.value">${state.players.filter(p=>!p.king).map(p=>`<option value="${p.id}" ${(appointedTarget===p.id||(!appointedTarget&&state.heir===p.id))?'selected':''}>${esc(p.name)}</option>`).join('')}</select>`:''}`:''}`:`<div class="fine">Only the monarch issues a decree this round. Your cards can still change the balance of power.</div>`;
  app.innerHTML=`<div class="shell"><header class="topbar"><div class="brand"><div class="sigil">♜</div><div><div class="brand-title">COURT OF CROWS</div><div class="brand-sub">A GAME OF GOLD & TREACHERY</div></div></div><div class="room-badge">ROOM <b>${state.code}</b> · <a href="#" onclick="event.preventDefault();navigator.clipboard?.writeText('${state.code}');toast('Room code copied')" style="color:var(--muted)">COPY CODE</a></div><button class="btn dark small" style="margin-left:9px" onclick="leaveCourt()">Leave court</button></header>
  <section class="hero" style="padding:35px 0 15px"><div class="eyebrow">${lobby?'A new court gathers':state.phase==='ended'?'The realm has a new ruler':'The court is in session'}</div><h1 style="font-size:clamp(39px,5vw,56px)">${lobby?'The game is afoot.':state.phase==='ended'?'The crown is claimed.':state.phase==='succession_vote'?'A new monarch must be chosen.':state.phase==='assassination'?'The knife is out.':state.phase==='pact_response'?'A pact awaits an answer.':`Round ${state.round}: <em>${esc(state.event)}</em>`}</h1><p>${lobby?'Share the room code with 1–7 friends. The host begins when all have arrived.':state.phase==='ended'?`${esc(state.players.find(p=>p.id===state.winner)?.name)} wins with ${state.players.find(p=>p.id===state.winner)?.gold||0} gold.`:state.phase==='succession_vote'?'The court chooses who inherits. Spend influence to make your vote count double.':state.phase==='assassination'?'The court must decide whether to support or oppose the plot.':state.phase==='pact_response'?state.pactOffer?.private?'A private pact offer is being considered.':state.pactOffer?.proposer?`You offered a pact to ${esc(state.pactOffer.to)}. They decide whether it takes effect.`:`${esc(state.pactOffer?.from)} offered you a pact. You decide whether it takes effect.`:'Choose one or two cards. Their effects are listed on each card.'}</p></section>
  <div class="stats"><div>GOLD TO WIN<strong>${state.target} gold</strong></div><div>IN THE COURT<strong>${state.players.length} of 8 players</strong></div><div>SUCCESSION<strong>${esc(state.succession)}</strong></div><div>YOUR INFLUENCE<strong>${me.influence}</strong></div>${state.heir?`<div>HEIR<strong>${esc(state.players.find(p=>p.id===state.heir)?.name||'—')}</strong></div>`:''}</div>
  <div class="table"><main class="maincol">${!lobby?`<div class="event-banner"><div><div class="eyebrow">This round’s event</div><h2>${esc(state.event)}</h2><div class="event-effect">${esc(state.eventEffect)}</div></div><div class="event-icon">✦</div></div>`:''}
  <div class="phase-label">The court · ${state.players.length} ${state.players.length===1?'soul':'souls'}</div><div class="roster">${state.players.map(p=>`<div class="player ${p.id===state.you?'current':''}"><div class="pname">${p.king?'♛ ':''}${esc(p.name)}${p.id===state.you?' <span style="color:var(--muted);font-weight:400">(you)</span>':''}</div><div class="role">${p.king?'THE MONARCH':p.deposed?'DEPOSED MONARCH':p.heir?'THE HEIR':'VASSAL'}</div><div class="coin">◉ ${p.gold} gold</div><div class="influence">✧ ${p.influence} influence</div><small>${lobby?'Awaiting the opening bell':p.ready?'Cards committed':'Choosing cards'}</small></div>`).join('')}</div>
  ${lobby?`<div class="waiting">${state.players.length<2?'Invite at least one more player to begin.':'Your court is assembled.'}<br>Room code <b style="color:var(--gold)">${state.code}</b></div>${state.host===state.you?`<button class="btn" style="margin-top:12px" onclick="act('start')">Begin the game →</button>`:'<div class="fine">The host will begin shortly.</div>'}`:''}
  ${state.phase==='play'?`<div class="phase-label">Your hand · choose up to two cards</div>${myplay?`<div class="waiting">Your cards are committed. Waiting for the rest of the court…</div>`:`<div class="hand">${state.hand.map((c,i)=>`<div class="card ${selected.includes(i)?'selected':''}" onclick="toggleCard(${i})"><span class="type">COURT CARD</span><b>${esc(c)}</b><small>${esc(state.almanac.cards[c])}</small></div>`).join('')}</div><div class="actionbox"><h3>Commit your play</h3><p>Choose one or two cards. Some cards need a target; the monarch also chooses a decree.</p>${targetFields}${decreePanel}<button class="btn" style="margin-top:12px" onclick="submitPlay()">Commit ${selected.length||'your'} card${selected.length===1?'':'s'} →</button></div>`}`:''}
  ${state.phase==='assassination'?`<div class="actionbox" style="border-color:#785041"><h3>The court is divided</h3><p>${state.assassination.yes} support · ${state.assassination.no} oppose · ${state.assassination.guard} guard. Support must outnumber opposition and guards combined. Spend 1 influence to make your vote count twice; accepted pacts can add a vote when allies agree.</p>${state.assassination.choice?`<div class="waiting">You chose to ${state.assassination.choice==='yes'?'support the plot':'oppose the plot'}. Waiting for the court…</div>`:`<label class="fine" style="display:block;margin:10px 0"><input type="checkbox" id="spend-assassination-influence" onchange="assassinationSpend=this.checked" ${assassinationSpend?'checked':''} ${me.influence<1?'disabled':''}> Spend 1 influence for a double vote (${me.influence} available)</label><div class="row"><button class="btn" onclick="voteAssassination('yes')">Support the plot</button><button class="btn dark" onclick="voteAssassination('no')">Oppose the plot</button></div>`}</div>`:''}
  ${state.phase==='pact_response'?`<div class="actionbox" style="border-color:#766643"><h3>${state.pactOffer?.private?'A private pact is pending':'Secret Pact offer'}</h3><p>${state.pactOffer?.private?'Another pair of players is considering a pact; its details remain private.':state.pactOffer?.proposer?`You offered an alliance to ${esc(state.pactOffer.to)}.`:`${esc(state.pactOffer?.from)} offers you an alliance.`} If accepted, both parties gain 1 influence. Pact allies who vote together add 1 support or opposition in an assassination. Rejection has no penalty. ${state.pactOffer?.remaining>1?`${state.pactOffer.remaining} pact offers await a response.`:''}</p>${state.pactOffer?.canRespond?`<div class="row"><button class="btn" onclick="act('pact',{accept:true})">Accept the pact</button><button class="btn dark" onclick="act('pact',{accept:false})">Reject the pact</button></div>`:state.pactOffer?.proposer?`<div class="waiting">Waiting for ${esc(state.pactOffer.to)} to decide…</div>`:`<div class="waiting">Waiting for the players to answer…</div>`}</div>`:''}
  ${state.phase==='succession_vote'?`<div class="actionbox"><h3>Choose the next monarch</h3><p>Each player casts one vote. Spend 1 influence to make yours count twice.</p>${state.successionVote.choice?`<div class="waiting">Your vote is recorded. ${state.successionVote.submitted} of ${state.successionVote.required} have voted.</div>`:`<select class="input" id="candidate">${state.players.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select><label class="fine" style="display:block;margin:10px 0"><input type="checkbox" id="spend-influence" onchange="successionSpend=this.checked" ${successionSpend?'checked':''} ${me.influence<1?'disabled':''}> Spend 1 influence for a double vote (${me.influence} available)</label><button class="btn" onclick="voteSuccession()">Cast vote →</button>`}</div>`:''}
  ${state.phase==='ended'?`<div class="actionbox"><h3>${esc(state.players.find(p=>p.id===state.winner)?.name)} wins!</h3><p>The gold speaks. The court has concluded.</p><button class="btn" style="margin-top:8px" onclick="leaveCourt()">Return to menu →</button></div>`:''}</main>
  <aside class="sidecol"><div class="sidepanel"><h3>Line of succession</h3><div class="succession">Current law<br><strong>${esc(state.succession)}</strong></div><div class="fine" style="margin-top:10px">${esc(lawText[state.succession]||'The monarch may change the succession law by decree.')}</div></div>${almanac()}<div class="sidepanel"><h3>Court Chat</h3><div class="chatlog" id="chat-log" aria-live="polite">${(state.chat||[]).map(m=>`<div class="chatline"><b>${esc(m.name)}</b>${esc(m.message)}<time>${new Date(m.at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</time></div>`).join('')||'<div class="fine">Send a message to the court.</div>'}</div><form class="chat-form" onsubmit="event.preventDefault();sendChat()"><input class="input" id="chat-input" maxlength="240" placeholder="Send a message…" value="${esc(chatDraft)}" oninput="chatDraft=this.value" aria-label="Chat message"><button class="btn small" type="submit">Send</button></form></div><div class="sidepanel"><h3>Whispers</h3><div class="log">${state.log.slice().reverse().map(x=>`<div class="logline">${esc(x)}</div>`).join('')}</div></div><div class="sidepanel"><h3>Race to the throne</h3><div class="fine">First to ${state.target} gold wins.</div>${state.players.map(p=>`<div style="margin-top:10px;font-size:11px;display:flex;justify-content:space-between"><span>${esc(p.name)}${p.king?' ♛':''}</span><span style="color:var(--gold)">${p.gold}/${state.target}</span></div><div class="progress"><span style="width:${Math.min(100,p.gold/state.target*100)}%"></span></div>`).join('')}</div></aside></div><div class="footer">Cards refresh each round · Alliances are temporary · The crown is never safe</div></div>`;
  if(eventModal)app.insertAdjacentHTML('beforeend',`<div class="event-overlay"><section class="event-modal" role="dialog" aria-modal="true" aria-labelledby="event-modal-title"><div class="eyebrow">A new event unfolds · Round ${state.round}</div><div class="event-art">${eventIllustration(eventModal.name)}</div><h2 id="event-modal-title">${esc(eventModal.name)}</h2><p>${esc(eventModal.effect)}</p><button class="btn" onclick="dismissEvent()">Enter the court →</button></section></div>`);const chatLog=document.querySelector('#chat-log');if(chatLog)chatLog.scrollTop=chatLog.scrollHeight;const chatInput=document.querySelector('#chat-input');if(chatInput&&restoreChatFocus){chatInput.focus();if(chatCursor!==null)chatInput.setSelectionRange(chatCursor,chatCursor)}
}
function dismissEvent(){eventModal=null;renderGame()}
function toggleCard(i){if(selected.includes(i))selected=selected.filter(x=>x!==i);else if(selected.length<2)selected.push(i);renderGame()}
function submitPlay(){if(!selected.length){toast('Choose at least one card.');return}const actions=selected.map(i=>({card:state.hand[i],target:targets[i]||state.players.find(p=>p.id!==state.you)?.id}));const payload={actions};const me=state.players.find(p=>p.id===state.you);if(me.king){payload.decree=decree;if(decree==='Favor a Vassal')payload.favor=document.querySelector('#favor')?.value;if(decree==='Change Succession'){payload.successionLaw=document.querySelector('#succession-law')?.value||selectedLaw;if(payload.successionLaw==='Appointed Heir')payload.appointedHeir=document.querySelector('#appointed-heir')?.value||state.heir;const changes=payload.successionLaw!==state.succession||(payload.successionLaw==='Appointed Heir'&&payload.appointedHeir!==state.heir);if(changes&&me.influence<2){toast('Changing succession costs 2 influence.');return}}}act('play',payload)}
function voteSuccession(){act('succession',{candidate:document.querySelector('#candidate').value,spendInfluence:successionSpend})}
function voteAssassination(vote){act('vote',{vote,spendInfluence:assassinationSpend})}
renderLanding();setInterval(refresh,1000);if(token&&roomCode)refresh();
</script></body></html>
