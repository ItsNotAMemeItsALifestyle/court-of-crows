function chronicleMoment(line,round){
  let m;
  if((m=line.match(/^(.+?) calls for the monarch's removal\./)))return{round,kind:`plot-call-${round}`,weight:58,text:`${m[1]} raised the black banner and called the realm to bring down its monarch.`};
  if(/^The court must choose whether to support or oppose the plot\./.test(line))return{round,kind:`plot-call-${round}`,weight:54,text:`The knives came out, and the court was forced to choose: defend the crown or join the plot.`};
  if((m=line.match(/^The plot draws (\d+) support against (\d+) opposition and (\d+) royal guards?\./))){const[,support,opposition,guards]=m;const succeeds=Number(support)>Number(opposition)+Number(guards);return{round,kind:`plot-result-${round}`,weight:108,text:`At the knife's edge, the plot mustered ${support} support against ${opposition} opposition and ${guards} royal guard${Number(guards)===1?'':'s'}; the blades ${succeeds?'struck true':'were turned aside'}.`}}
  if((m=line.match(/^(.+?) is assassinated!/)))return{round,kind:`assassination-${round}`,weight:112,text:`The monarch fell beneath the knives: ${m[1]} was assassinated, and the realm's succession law was put to the test.`};
  if((m=line.match(/^(.+?) survives\. Opposition and guards hold\./)))return{round,kind:`assassination-${round}`,weight:106,text:`The crown nearly fell, but ${m[1]} survived the assassination attempt; loyal opposition and the royal guard held the line.`};
  if((m=line.match(/^(.+?) wins the court vote and takes the throne\./)))return{round,kind:`succession-${round}`,weight:101,text:`With the old reign ended, the court chose its next ruler: ${m[1]} won the succession vote and claimed the throne.`};
  if((m=line.match(/^(.+?) inherits under (.+?)\./)))return{round,kind:`succession-${round}`,weight:96,text:`By the law of ${m[2]}, ${m[1]} inherited the crown after the upheaval.`};
  if((m=line.match(/^(.+?) spends \d+ influence to change succession to (.+?)(?:, naming (.+))?\./)))return{round,kind:`law-${round}`,weight:68,text:`${m[1]} rewrote the law of inheritance to ${m[2]}${m[3]?`, naming ${m[3]} as heir`:''}, changing who would stand nearest the throne.`};
  if((m=line.match(/^(.+?) offers a Secret Pact to (.+?)(?: through the Royal Treasury combo)?\./)))return{round,kind:`pact-offer-${round}-${m[1]}-${m[2]}`,weight:62,text:`With the crown in danger, ${m[1]} reached out to ${m[2]} with a Secret Pact, wagering trust for influence.`};
  if((m=line.match(/^(.+?) accepts (.+?)'s Secret Pact\.(.*)$/)))return{round,kind:`pact-${round}-${m[1]}-${m[2]}`,weight:78,text:`A dangerous alliance was sealed: ${m[1]} accepted ${m[2]}'s pact${m[3].includes('Royal Treasury')?', and the Royal Treasury combo enriched them both':''}.`};
  if((m=line.match(/^(.+?) rejects (.+?)'s Secret Pact\./)))return{round,kind:`pact-${round}-${m[1]}-${m[2]}`,weight:66,text:`${m[1]} spurned ${m[2]}'s Secret Pact; the alliance died before it could bind the court.`};
  if(/^A Secret Pact is accepted\./.test(line))return{round,kind:`pact-${round}`,weight:72,text:`Two rivals sealed a Secret Pact, binding themselves in an alliance for the struggle ahead.`};
  if(/^A Secret Pact is rejected\./.test(line))return{round,kind:`pact-${round}`,weight:60,text:`A Secret Pact was rejected, and a possible alliance dissolved into suspicion.`};
  if((m=line.match(/^(.+?) blackmails (.+?) for (\d+) gold\./))&&Number(m[3])>=2)return{round,kind:`blackmail-${round}-${m[1]}`,weight:79,text:`In a brazen act of blackmail, ${m[1]} stripped ${m[2]} of ${m[3]} gold and carried the spoils away.`};
  if((m=line.match(/^(.+?)'s Guild Investment returns (\d+) gold\./)))return{round,kind:`investment-${round}-${m[1]}`,weight:67,text:`A wager placed earlier paid off: ${m[1]}'s Guild Investment returned ${m[2]} gold when it mattered.`};
  if((m=line.match(/^(.+?) favors (.+?): \+2 gold, \+\d+ influence, \+1 gold to the crown\./)))return{round,kind:`favor-${round}`,weight:58,text:`${m[1]} bound the heir, ${m[2]}, closer to the crown with a rich royal favor.`};
  if((m=line.match(/^(.+?) rewards (.+?): \+2 gold, \+\d+ influence, \+1 gold to the crown\./)))return{round,kind:`favor-${round}`,weight:58,text:`${m[1]} bought loyalty with a royal reward for ${m[2]}, strengthening both vassal and crown.`};
  if((m=line.match(/^(.+?) combines Royal Guard and Mercenary Band for 1 extra guard\./)))return{round,kind:`defense-${round}`,weight:51,text:`${m[1]} forged a formidable defense, joining the Royal Guard with hired steel.`};
  if((m=line.match(/^(.+?) claims 3 gold and \d+ influence under Royal Prerogative\./)))return{round,kind:`prerogative-${round}`,weight:18,text:`${m[1]} invoked Royal Prerogative to draw 3 gold into the crown's coffers.`};
  return null;
}
function chronicle(){

  const pactOutcomes=all.filter(m=>m.kind.startsWith('pact-')&&!m.kind.startsWith('pact-offer-')).sort((a,b)=>(b.weight+Math.min(b.round,8))-(a.weight+Math.min(a.round,8)));const pactMoments=(pactOutcomes.length?pactOutcomes:all.filter(m=>m.kind.startsWith('pact-offer-'))).slice(0,2);
  const successionMoments=all.filter(m=>m.kind.startsWith('succession-')||m.kind.startsWith('law-')).sort((a,b)=>(b.weight+Math.min(b.round,8))-(a.weight+Math.min(a.round,8))).slice(0,1);const fortuneMoments=all.filter(m=>/^(blackmail|investment|favor)-/.test(m.kind)).sort((a,b)=>(b.weight+Math.min(b.round,8))-(a.weight+Math.min(a.round,8))).slice(0,1);

function save(){localStorage.setItem('crows-token',token);localStorage.setItem('crows-room',roomCode)}
function clearRoomSession(){token=null;roomCode=null;state=null;selected=[];targets={};localStorage.removeItem('crows-token');localStorage.removeItem('crows-room');renderLanding()}
async function leaveCourt(){const finished=state?.phase==='ended';if(!finished&&!window.confirm('Leave this match? Your player will leave the court, and the game may return to the lobby if fewer than two players remain.'))return;try{if(!finished&&token&&roomCode)await api('leave/'+roomCode,{token})}catch(e){toast(e.message);return}clearRoomSession()}
async function create(){try{const d=await api('create',{name:document.querySelector('#create-name').value||'Player'});token=d.token;roomCode=d.state.code;save();update(d.state)}catch(e){toast(e.message)}}
async function join(){try{const c=document.querySelector('#code').value.trim().toUpperCase();const d=await api('join/'+c,{name:document.querySelector('#join-name').value||'Player'});token=d.token;roomCode=c;save();update(d.state)}catch(e){toast(e.message)}}
async function act(path,data={}){try{const d=await api(path+'/'+roomCode,{...data,token});update(d.state)}catch(e){toast(e.message)}}
async function sendChat(){const message=chatDraft.trim();if(!message)return;chatDraft='';try{const d=await api('chat/'+roomCode,{token,message});update(d.state)}catch(e){chatDraft=message;toast(e.message);renderGame()}}
async function refresh(){if(!token||!roomCode||polling||Date.now()<nextPollAt)return;polling=true;const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),8000);try{const d=await api('state/'+roomCode+'?token='+encodeURIComponent(token),undefined,{signal:controller.signal});pollFailures=0;nextPollAt=0;const recovered=Boolean(connectionIssue);connectionIssue='';update(d.state);if(recovered&&state)renderGame();connectionNotice()}catch(error){connectionIssue=error?.message||'Connection interrupted';pollFailures=Math.min(pollFailures+1,5);nextPollAt=Date.now()+Math.min(15000,1000*2**(pollFailures-1));if(state)renderGame();else renderLanding();connectionNotice()}finally{clearTimeout(timeout);polling=false}}
function update(s){
  if(!s)return;
  const previous=state;
  const changed=JSON.stringify(state)!==JSON.stringify(s);
  if(!changed)return;
  const began=previous?.phase==='lobby'&&s.phase==='play';
  const won=s.phase==='ended'&&previous?.phase!=='ended';
  const newLogs=previous&&s.log.length>=previous.log.length?s.log.slice(previous.log.length):s.log;
  const monarchFell=newLogs.some(line=>line.includes(' is assassinated!'));
  const sameTurn=state&&state.code===s.code&&state.phase===s.phase&&state.round===s.round&&JSON.stringify(state.hand)===JSON.stringify(s.hand);
  if(previous){
    if(s.phase==='assassination'&&previous.phase!=='assassination')sound('plot');
    if(s.round>previous.round&&s.event){eventModal={name:s.event,effect:s.eventEffect};if(!began)sound('event')}
    if(s.players.some(p=>p.gold>(previous.players.find(old=>old.id===p.id)?.gold??p.gold)))sound('coin');
  }
  state=s;
  if(!sameTurn){selected=[];targets={};assassinationSpend=false;successionSpend=false}
  if(won){playVictoryFanfare()}
  else if(began){playOpeningFanfare()}
  else if(monarchFell){playAssassinationSting()}
  else if(state.phase==='ended'||state.phase==='lobby')stopIntrigue();
  else startIntrigue();
  renderGame()
}

  if(eventModal)app.insertAdjacentHTML('beforeend',`<div class="event-overlay"><section class="event-modal" role="dialog" aria-modal="true" aria-labelledby="event-modal-title"><div class="eyebrow">A new event unfolds · Round ${state.round}</div><div class="event-art">${eventIllustration(eventModal.name)}</div><h2 id="event-modal-title">${esc(eventModal.name)}</h2><p>${esc(eventModal.effect)}</p><button class="btn" onclick="dismissEvent()">Enter the court →</button></section></div>`);const chatLog=document.querySelector('#chat-log');if(chatLog)chatLog.scrollTop=chatLog.scrollHeight;const chatInput=document.querySelector('#chat-input');if(chatInput&&restoreChatFocus){chatInput.focus();if(chatCursor!==null)chatInput.setSelectionRange(chatCursor,chatCursor)}renderTutorial()

function toggleCard(i){if(selected.includes(i))selected=selected.filter(x=>x!==i);else if(selected.length<2)selected.push(i);renderGame()}
function submitPlay(){
  if(!selected.length){toast('Choose at least one card.');return}
  const actions=selected.map(i=>({card:state.hand[i],target:targets[i]||state.players.find(p=>p.id!==state.you)?.id}));
  const payload={actions};
  const me=state.players.find(p=>p.id===state.you);
  if(me.office==='Chancellor'||me.office==='Treasurer')payload.officeTarget=document.querySelector('#office-target')?.value||officeTarget;
  if(me.king){
    payload.decree=decree;
    if(decree==='Favor a Vassal')payload.favor=document.querySelector('#favor')?.value;
    if(decree==='Court Appointment'){
      payload.appointmentAction=document.querySelector('#office-action')?.value||appointmentAction;
      payload.appointmentTarget=document.querySelector('#appointment-target')?.value||appointmentTarget;
      if(payload.appointmentAction==='appoint')payload.appointmentRole=document.querySelector('#office-role')?.value||appointmentRole;
    }
    if(decree==='Change Succession'){
      payload.successionLaw=document.querySelector('#succession-law')?.value||selectedLaw;
      if(payload.successionLaw==='Appointed Heir')payload.appointedHeir=document.querySelector('#appointed-heir')?.value||state.heir;
      const changes=payload.successionLaw!==state.succession||(payload.successionLaw==='Appointed Heir'&&payload.appointedHeir!==state.heir);
      if(changes&&me.influence<2){toast('Changing succession costs 2 influence.');return}
    }
  }
  act('play',payload)
}
function voteSuccession(){act('succession',{candidate:document.querySelector('#candidate').value,spendInfluence:successionSpend})}
function voteAssassination(vote){act('vote',{vote,spendInfluence:assassinationSpend})}
renderLanding();setInterval(refresh,1000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});if(token&&roomCode)refresh();
</script></body></html>
